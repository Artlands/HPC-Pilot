name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check hpc_pilot/ tests/ scripts/

      - name: Black check
        run: black --check hpc_pilot/ tests/ scripts/

      - name: Mypy check
        run: mypy hpc_pilot/

      - name: Pytest
        run: pytest tests/ -q

      - name: Coverage
        run: pytest --cov=hpc_pilot --cov-report=xml --cov-fail-under=75

      - name: Tool name lint
        run: python scripts/check_tool_names.py
