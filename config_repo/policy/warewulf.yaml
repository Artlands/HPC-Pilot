# Warewulf provisioning policy rules. See spec 01 §4.
# Evaluated top-down; first decisive rule wins.

- id: image-build-autoallow
  match: { domain: "warewulf", op: "build" }
  assert:
    blast_radius: { "<=": 1 }
  effect: auto
  message: "Single-image builds run without approval."

- id: node-provision-autoallow
  match: { domain: "warewulf", op: "provision" }
  assert:
    blast_radius: { "<=": 4 }
  effect: auto
  message: "Provisioning up to 4 nodes runs without approval."

- id: bootstrap-dhcp-approval
  match: { tool: "warewulf.configure_dhcp" }
  effect: require_approval
  message: "DHCP configuration always requires explicit approval."

- id: bootstrap-tftp-nfs-autoallow
  match: { domain: "warewulf", op: "configure" }
  assert:
    blast_radius: { "<=": 4 }
  effect: auto
  message: "TFTP/NFS configuration with small blast radius runs without approval."
