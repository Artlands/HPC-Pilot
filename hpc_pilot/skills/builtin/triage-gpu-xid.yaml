name: triage-gpu-xid
description: Diagnose a GPU XID error — identify the error code, check dmesg and DCGM, recommend action.
required_role: operator
inputs:
  - name: node
    type: string
    required: true
  - name: xid_code
    type: string
    required: false
steps:
  - id: identify_xid
    tool: hpc_logs_dmesg_xid
    args: {node: "{{ node }}"}
  - id: gpu_status
    tool: hpc_gpu_nvidia_smi
    args: {node: "{{ node }}"}
  - id: dcgm_diag
    tool: hpc_gpu_dcgm_diag
    args: {node: "{{ node }}"}
  - id: recommend
    builtin: for_each
    args: {}
on_failure: pause
