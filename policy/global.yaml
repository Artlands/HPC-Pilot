# Global policy rules
# These rules apply across all domains

- id: blackout-window
  match: { risk: ["medium", "high"] }
  when: { time_in: "Mon 02:00-04:00 America/Chicago" }
  on_violation: deny
  message: "Blocked during nightly backup window"

- id: node-blast-cap
  match: { domain: "warewulf" }
  assert: { blast_radius: { "<=": 8 } }
  on_violation: require_approval

- id: dhcp-always-approval
  match: { tool: "warewulf.configure_dhcp" }
  effect: require_approval
  message: "DHCP configuration always requires approval (HIGH risk)"
