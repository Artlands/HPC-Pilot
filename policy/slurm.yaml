# Slurm policy rules (spec 01 §4)
# These rules enforce site-specific limits on QOS and accounts

- id: qos-wall-cap
  match: { tool: "slurm.manage_qos", op: "create" }
  assert:
    max_wall_min: { "<=": 4320 }
  on_violation: deny
  message: "QOS wall time above 3 days requires manual sacctmgr by an admin"

- id: qos-wall-autoallow
  match: { tool: "slurm.manage_qos", op: "modify" }
  assert:
    max_wall_min: { "<=": 2880 }
  effect: auto
  message: "Wall time <= 48h auto-approved"

- id: qos-gpu-cap
  match: { tool: "slurm.manage_qos" }
  assert:
    max_tres.gpu: { "<=": 16 }
  on_violation: require_approval
  message: "GPU TRES > 16 requires approval"

- id: account-create-approval
  match: { tool: "slurm.extend_account", op: "create" }
  effect: require_approval
  message: "New account creation requires approval"

- id: account-wall-autoallow
  match: { tool: "slurm.extend_account", op: "modify" }
  assert:
    max_wall_min: { "<=": 2880 }
  effect: auto
  message: "Account wall time <= 48h auto-approved"
