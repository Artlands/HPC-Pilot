# Warewulf-specific policy rules
# These rules govern container image builds and provisioning

- id: gpu-image-approval
  match: { tool: "warewulf.build_node_image", kind: "compute_gpu" }
  effect: require_approval
  message: "GPU image builds require approval due to driver complexity"

- id: multi-node-autoallow
  match: { tool: "warewulf.assign_image_to_nodes" }
  assert:
    nodes.length: { "<=": 4 }
  effect: auto
  message: "Assigning to <= 4 nodes auto-approved"
