[project]
name = "hpc-pilot"
version = "1.0.0"
description = "HPC Pilot - AI agent for HPC cluster management (Slurm, Warewulf, Ansible, Spack)"
requires-python = ">=3.11"
dependencies = [
    # Hermes Agent (model-agnostic AI agent runtime)
    "hermes-agent>=0.16",
    # Load ~/.hpc-pilot/.env automatically
    "python-dotenv>=1.0",
    # Read config.yaml
    "pyyaml>=6.0",
]

[project.optional-dependencies]
telegram = [
    "python-telegram-bot>=21.0",
]
discord = [
    "discord.py>=2.3",
]
gateway = [
    "hpc-pilot[telegram,discord]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]
webui = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
tui = [
    "rich>=13.0",
]

[project.scripts]
hpc-pilot = "hpc_pilot.cli:main"
hpc-pilot-gateway = "hpc_pilot.gateway:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hpc_pilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["UP042"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Pre-existing mypy issues scoped per module so CI doesn't false-green.
[[tool.mypy.overrides]]
module = "hpc_pilot.metrics"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "hpc_pilot.tools._registry"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "hpc_pilot.tools.evolve"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "hpc_pilot.agent"
disable_error_code = ["type-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "hpc_pilot.webui"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "hpc_pilot.hermes_plugin.*"
disable_error_code = ["type-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "hpc_pilot.cli"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "hpc_pilot.skills.runner"
disable_error_code = ["name-defined", "attr-defined"]

[[tool.mypy.overrides]]
module = "hpc_pilot.tools.slurm"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "hpc_pilot.tools.system"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "hpc_pilot.tools.multi"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

